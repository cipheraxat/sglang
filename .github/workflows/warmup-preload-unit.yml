name: Warmup preload unit tests

on:
  push:
    branches:
      - ci/warmup-preload-unit

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install pytest addict pyyaml orjson pyzmq safetensors dill imageio python-dateutil \
            psutil pybase64 requests starlette msgspec pydantic tqdm ipython aiohttp einops \
            transformers sentencepiece compressed-tensors gguf diffusers \
            cloudpickle cache-dit openai partial-json-parser triton packaging

      - name: Run server-args and component-residency unit tests
        run: |
          PYTHONPATH=python python -m pytest \
            python/sglang/multimodal_gen/test/unit/test_server_args.py \
            python/sglang/multimodal_gen/test/unit/test_component_residency.py \
            -q --tb=line -p no:cacheprovider
